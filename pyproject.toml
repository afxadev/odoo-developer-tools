[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "odoo-developer-tools"
description = "Modern, lightweight, and extensible CLI developer tools for Odoo development workflow."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{name = "Afxadev Technologies"}]
dynamic = ["version"]
dependencies = [
    "click>=8.0",
    "docutils>=0.18",
    "pypandoc>=1.11",
    "jinja2>=3.0",
    "pyyaml>=5.4",
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
homepage = "https://github.com/afxadev/odoo-developer-tools"
repository = "https://github.com/afxadev/odoo-developer-tools"

[project.scripts]
odt = "tools.cli:main"
odt-gen-addon-readme = "tools.gen_addon_readme:main"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.hatch.version]
source = "vcs"

# Used when there is no git metadata (zip download, sdist without .git, ...)
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
